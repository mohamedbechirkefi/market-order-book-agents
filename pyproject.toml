# Dependency resolution is limited to releases published before 2026-11-10 (two weeks before
# the first session, 2026-11-24) through tool.uv.exclude-newer.
[project]
name = "market-order-book-agents"
version = "0.0.0"
description = "Agent-based limit-order-book market simulation (research project MARKET)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market"]

[tool.uv]
exclude-newer = "2026-11-10T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
